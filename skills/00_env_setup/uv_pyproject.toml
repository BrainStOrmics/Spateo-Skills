# ============================================================================
# Spateo + ref_scripts Environment (Python 3.10)
# Generated: 2026-06-12
# Usage: uv sync --project envs/uv_pyproject.toml
#   or:  uv pip compile envs/uv_pyproject.toml -o envs/uv_lock.txt
# ============================================================================

[project]
name = "spateo-env"
version = "0.1.0"
description = "Clean uv environment for Spateo + ref_scripts (Python 3.10)"
requires-python = ">=3.10,<3.11"

dependencies = [
    # ── Spateo core (not on PyPI, install from git) ──────────────────
    "spateo-release @ git+https://github.com/aristoteleo/spateo-release.git",

    # ── Core scientific (Spateo py<3.11 constraints) ─────────────────
    "numpy>=1.21,<1.24",
    "scipy>=1.9,<1.11",
    "pandas>=1.4,<1.6",

    # ── ML / Stats ───────────────────────────────────────────────────
    "scikit-learn>=1.0,<1.4",
    "scikit-image>=0.19,<0.23",
    "matplotlib>=3.7,<3.9",
    "seaborn>=0.12",
    "statsmodels>=0.14",

    # ── Deep Learning ────────────────────────────────────────────────
    "torch>=2.0,<2.5",
    "gpytorch>=1.10",
    "pyro-ppl>=1.8",
    "opt-einsum",
    "kornia>=0.6",

    # ── Single-cell / spatial omics ──────────────────────────────────
    "anndata>=0.8,<0.10",
    "scanpy>=1.9",
    "h5py>=3.7,<3.9",
    "loompy>=3.0.5",
    "mudata>=0.2",
    "leidenalg>=0.10",
    "python-igraph>=0.10",
    "umap-learn>=0.5",
    "pynndescent>=0.5",
    "numba>=0.56",

    # ── Geospatial ───────────────────────────────────────────────────
    "geopandas>=0.12,<0.15",
    "shapely>=1.8,<2.0",
    "fiona>=1.9",
    "pyproj>=3.5",
    "pyogrio>=0.7",
    "rtree>=1.0",
    "affine",
    "rasterio>=1.3",
    "rasterstats>=0.21",
    "descartes",

    # ── PySAL ecosystem ──────────────────────────────────────────────
    "pysal>=23.0",
    "libpysal",
    "mapclassify>=2.4.2",
    "esda",
    "giddy",
    "inequality",
    "pointpats",
    "segregation",
    "spaghetti",
    "spglm",
    "spint",
    "splot",
    "spopt",
    "spreg",
    "spvcm",
    "tobler",
    "momepy",
    "mgwr",

    # ── 3D / Visualization ───────────────────────────────────────────
    "vtk>=9.2",
    "pyvista>=0.39",
    "trame>=2.2.5",
    "trame-server>=2.7.0",
    "open3d>=0.16",
    "pyacvd>=0.2",
    "pymcubes",
    "pymeshfix>=0.15",
    "pykdtree",

    # ── Plotting ─────────────────────────────────────────────────────
    "plotly>=5.0",
    "folium>=0.12.1",
    "colorcet>=2.0.1",
    "ipywidgets>=7.7.1",
    "adjustText",
    "kneed>=0.7.0",

    # ── Image processing ─────────────────────────────────────────────
    "opencv-python>=4.5",
    "csbdeep>=0.6.3",
    "pillow>=9.0",
    "imageio>=2.20",
    "tifffile>=2023.0",

    # ── Data formats ─────────────────────────────────────────────────
    "pyarrow>=14.0",
    "openpyxl>=3.1",

    # ── Optimal transport ────────────────────────────────────────────
    "POT>=0.8.1",

    # ── Utilities ────────────────────────────────────────────────────
    "networkx>=2.8",
    "tqdm>=4.62",
    "requests>=2.28",
    "joblib>=1.2",
    "pyyaml>=6.0",
    "typing-extensions>=4.0",
    "pooch",
    "psutil>=5.6",
    "sympy",
    "pulp",
    "session-info",
    "nbconvert",
    "setuptools>=58,<81",
]

# NOTE: dynamo-release is NOT on PyPI.
# Install separately: conda install -c conda-forge dynamo-release
# Or from GitHub: pip install git+https://github.com/aristoteleo/Dynamo-release.git

[project.optional-dependencies]
jupyter = ["ipykernel", "jupyterlab", "notebook"]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-downloads = "automatic"
index-url = "https://pypi.org/simple/"

[tool.uv.sources]
spateo-release = { git = "https://github.com/aristoteleo/spateo-release.git" }
